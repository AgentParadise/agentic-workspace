  <text x="52" y="178" fill="#B7D2D4" font-family="Arial, Helvetica, sans-serif" font-size="20">One contract. Local and Docker implementations.</text>
  <g fill="none" stroke="#5DDEEF" stroke-width="3" opacity=".7">
    <circle cx="1050" cy="114" r="73"/><circle cx="1050" cy="114" r="48"/>
