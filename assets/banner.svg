  <rect x="0" y="0" width="1200" height="230" rx="20" fill="none" stroke="#337784" stroke-width="2"/>
  <path d="M50 47H178" stroke="#5DDEEF" stroke-width="4" stroke-linecap="round"/>
  <text x="50" y="80" fill="#72DAB9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">AGENT PARADISE</text>
