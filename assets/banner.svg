<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Workspace</title>
  <desc id="desc">Agent Paradise banner for provider-neutral agent workspaces.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B2025"/><stop offset="1" stop-color="#0D3F49"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#5DDEEF" stroke-opacity=".1"/></pattern>
  </defs>
  <rect width="1200" height="230" rx="20" fill="url(#bg)"/>
