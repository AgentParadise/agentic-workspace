name: CI

on:
  push:
    branches: [main]
  pull_request:
    # release too: the main -> release PR must pass the same required checks.
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Docker conformance suite runs the Codex sandbox opt-in, which on
      # this AppArmor host needs its profile loaded (host setup step; see
      # lib/python/agentic_isolation/agentic_isolation/apparmor/README.md).
      - name: Load Codex sandbox AppArmor profile
        run: sudo apparmor_parser -r lib/python/agentic_isolation/agentic_isolation/apparmor/agentic-codex-sandbox
      - run: cargo test --workspace
      - name: Verify APSS pin
        run: |
          grep -F 'id: EXP-V1-0006' APSS.yaml
          grep -F 'version: "=0.1.0"' APSS.yaml
          grep -F 'id = "EXP-V1-0006"' apss.lock
          grep -F 'version = "0.1.0"' apss.lock
          grep -F 'rev=18d55b231e7d06b509386b2599f925195b63ba0c#18d55b231e7d06b509386b2599f925195b63ba0c' Cargo.lock
          cargo tree -p agentic-workspace-core | grep -F 'apss-v1-0006-workspace v0.1.0'

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The Docker conformance suite runs the Codex sandbox opt-in, which on
      # this AppArmor host needs its profile loaded (host setup step; see
      # lib/python/agentic_isolation/agentic_isolation/apparmor/README.md).
      - name: Load Codex sandbox AppArmor profile
        if: runner.os == 'Linux'
        run: sudo apparmor_parser -r lib/python/agentic_isolation/agentic_isolation/apparmor/agentic-codex-sandbox
      - run: cargo test --workspace

  itmux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo test --locked --manifest-path implementations/docker/interactive-tmux/driver-rs/Cargo.toml

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        package:
          - agentic_events
          - agentic_isolation
          - agentic_logging
          - agentic_memory
          - agentic_session_store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lib/python/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  consumer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/consumer_contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  plugin-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
      - run: uv sync --locked --all-extras --project lib/python/agentic_events
      - run: uv run --project lib/python/agentic_events pytest -q plugins/workspace/tests

  docker-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
      - name: Verify Vercel Skills CLI pin
        run: |
          test ! -e providers/workspaces
          test "$(grep -R -l '^ARG SKILLS_CLI_VERSION=1.7.0$' implementations/docker/images/*/Dockerfile | wc -l)" -eq 3
          ! grep -R -E 'skills@[0-9]+\.[0-9]+\.[0-9]+' implementations/docker/images/*/Dockerfile
      - run: uv run scripts/build-provider.py claude-cli --stage-only
      - run: uv run scripts/build-provider.py omni-agent --stage-only
      - run: uv run scripts/build-provider.py toolchain --stage-only
      - name: Lint toolchain and release scripts
        run: |
          shellcheck \
            implementations/docker/images/toolchain/scripts/toolchain-entrypoint.sh \
            implementations/docker/images/toolchain/smoke/run.sh \
            implementations/docker/images/toolchain/smoke/inside.sh \
            .github/scripts/release-image-tags.sh

  docker-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The Docker conformance suite runs the Codex sandbox opt-in, which on
      # this AppArmor host needs its profile loaded (host setup step; see
      # lib/python/agentic_isolation/agentic_isolation/apparmor/README.md).
      - name: Load Codex sandbox AppArmor profile
        run: sudo apparmor_parser -r lib/python/agentic_isolation/agentic_isolation/apparmor/agentic-codex-sandbox
      - name: Run isolated provider contract
        env:
          REQUIRE_DOCKER_CONFORMANCE: "1"
        run: cargo test -p agentic-workspace-docker --test conformance

  # TEMPORARY (agentic-workspace#19): measure the journal writable root under
  # AppArmor enforce with the real pinned binaries. Removed before merge.
  apparmor-depth3-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/agentparadise/agentic-workspace-omni-agent@sha256:12e7dc55d7aad558798552f2f373ddc0aebd3205e5b30543ff8751a2a12a0189
      PROFILE: lib/python/agentic_isolation/agentic_isolation/apparmor/agentic-codex-sandbox
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: docker pull "$IMAGE"
      - name: Probe script
        run: |
          cat > /tmp/probe.sh <<'SH'
          cd /workspace || exit 9
          mkdir -p /spool/.agentic-session-store/run
          try() {
            label=$1; root=$2; target=$3
            if codex sandbox -c 'sandbox_mode="workspace-write"' \
                -c "sandbox_workspace_write.writable_roots=[\"$root\"]" \
                -c sandbox_workspace_write.network_access=true \
                -- /bin/sh -c ": > '$target' && rm -f '$target'" >/tmp/out 2>&1; then
              echo "RESULT $label: allowed"
            else
              echo "RESULT $label: denied ($(grep -m1 -E 'bwrap|rror|denied' /tmp/out))"
            fi
          }
          try "journal partition" /spool/.agentic-session-store/run /spool/.agentic-session-store/run/x
          try "spool root" /spool /spool/x
          try "metadata namespace" /spool/.agentic-session-store /spool/.agentic-session-store/x
          try "no extra root, workspace" /workspace /workspace/x
          SH
      - name: Run (profile, seccomp) container helper
        run: |
          cat > /tmp/run.sh <<'SH'
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --security-opt seccomp="$GITHUB_WORKSPACE/lib/python/agentic_isolation/agentic_isolation/seccomp/codex-sandbox.json" \
            --security-opt apparmor=agentic-codex-sandbox \
            -v "$GITHUB_WORKSPACE/lib/python/agentic_session_store:/src:ro" -v /tmp/probe.sh:/probe.sh:ro \
            -e PYTHONPATH=/src --tmpfs /tmp:rw,exec --entrypoint bash "$IMAGE" -c "$1"
          SH
          chmod +x /tmp/run.sh
      - name: Old profile (origin/main), enforce
        run: |
          git show origin/main:"$PROFILE" > /tmp/old-profile
          sudo apparmor_parser -r /tmp/old-profile
          /tmp/run.sh 'bash /probe.sh'
      - name: New profile, enforce
        run: |
          sudo apparmor_parser -r "$PROFILE"
          /tmp/run.sh 'bash /probe.sh'
      - name: Pinned depth three, new profile, enforce
        run: |
          /tmp/run.sh 'export AGENTIC_PINNED_ROOT=/home/agent/pinned AGENTIC_PINNED_WORKSPACE=/workspace AGENTIC_PINNED_SPOOL=/spool CLAUDE_NATIVE_TEST_BINARY=$(command -v claude) CODEX_NATIVE_TEST_BINARY=$(command -v codex); cd /workspace && python3 /src/tests/test_pinned_depth_three.py'
      - name: Pinned depth three, old profile, enforce (expected to fail)
        continue-on-error: true
        run: |
          sudo apparmor_parser -r /tmp/old-profile
          /tmp/run.sh 'export AGENTIC_PINNED_ROOT=/home/agent/pinned AGENTIC_PINNED_WORKSPACE=/workspace AGENTIC_PINNED_SPOOL=/spool CLAUDE_NATIVE_TEST_BINARY=$(command -v claude) CODEX_NATIVE_TEST_BINARY=$(command -v codex); cd /workspace && python3 /src/tests/test_pinned_depth_three.py test_claude_codex_claude 2>&1 | tail -5'

  required:
    name: Required CI
    if: always()
    needs: [rust-quality, rust-test, itmux-test, python-compatibility, consumer-contracts, plugin-hooks, docker-context, docker-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          ITMUX_RESULT: ${{ needs.itmux-test.result }}
          PYTHON_RESULT: ${{ needs.python-compatibility.result }}
          CONSUMER_CONTRACTS_RESULT: ${{ needs.consumer-contracts.result }}
          PLUGIN_HOOKS_RESULT: ${{ needs.plugin-hooks.result }}
          DOCKER_RESULT: ${{ needs.docker-context.result }}
          DOCKER_CONFORMANCE_RESULT: ${{ needs.docker-conformance.result }}
        run: |
          test "$RUST_QUALITY_RESULT" = success
          test "$RUST_TEST_RESULT" = success
          test "$ITMUX_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$CONSUMER_CONTRACTS_RESULT" = success
          test "$PLUGIN_HOOKS_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$DOCKER_CONFORMANCE_RESULT" = success
