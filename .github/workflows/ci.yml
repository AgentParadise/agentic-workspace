name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify APSS pin
        run: |
          grep -F 'id = "EXP-V1-0006"' apss.lock
          grep -F 'version = "0.1.0"' apss.lock

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo test --workspace

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        package:
          - agentic_events
          - agentic_isolation
          - agentic_logging
          - agentic_memory
          - agentic_session_store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lib/python/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  docker-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v6
      - run: uv run scripts/build-provider.py claude-cli --stage-only
      - run: uv run scripts/build-provider.py omni-agent --stage-only

  docker-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run isolated provider contract
        env:
          REQUIRE_DOCKER_CONFORMANCE: "1"
        run: cargo test -p agentic-workspace-docker --test conformance

  required:
    name: Required CI
    if: always()
    needs: [rust-quality, rust-test, python-compatibility, docker-context, docker-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
          RUST_TEST_RESULT: ${{ needs.rust-test.result }}
          PYTHON_RESULT: ${{ needs.python-compatibility.result }}
          DOCKER_RESULT: ${{ needs.docker-context.result }}
          DOCKER_CONFORMANCE_RESULT: ${{ needs.docker-conformance.result }}
        run: |
          test "$RUST_QUALITY_RESULT" = success
          test "$RUST_TEST_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$DOCKER_CONFORMANCE_RESULT" = success
