[workspace]
members = [
  "crates/workspace-core",
  "crates/workspace-conformance",
  "implementations/docker",
  "implementations/local",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
wait-timeout = "0.2"
sha2 = "0.10"
