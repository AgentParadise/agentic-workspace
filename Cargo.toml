[workspace]
members = [
  "crates/workspace-core",
  "crates/workspace-conformance",
  "implementations/docker",
  "implementations/local",
]
exclude = [".apss/build", "implementations/docker/interactive-tmux/driver-rs"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"
thiserror = "2"
tempfile = "3"
wait-timeout = "0.2"
sha2 = "0.11"
apss-workspace-standard = { git = "https://github.com/AgentParadise/agent-paradise-standards-system", rev = "ee926c6e44c0e37ad524e0ee265ffc4fabb714fc", package = "apss-v1-0006-workspace" }
