[workspace]
members = [
  "crates/workspace-core",
  "crates/workspace-conformance",
  "implementations/docker",
  "implementations/local",
]
exclude = [".apss/build"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
wait-timeout = "0.2"
sha2 = "0.10"
apss-workspace-standard = { git = "https://github.com/AgentParadise/agent-paradise-standards-system", rev = "18d55b231e7d06b509386b2599f925195b63ba0c", package = "apss-v1-0006-workspace" }
