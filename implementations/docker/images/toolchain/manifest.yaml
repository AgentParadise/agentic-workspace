# Toolchain Workspace Provider Manifest
# The omni-agent image plus a native toolchain: a C toolchain, the rustup
# binary (no toolchain), pnpm through corepack, and bun. For repositories whose
# own gates compile native code.
#
# See ADR-027: Provider-Based Workspace Images
# See ADR-040 section 12: The workspace image contract

name: toolchain
version: "1.0.0"
description: >-
  omni-agent (claude + codex on the shared capability runtime) plus a native
  toolchain: build-essential, pkg-config, unzip, rustup (toolchain chosen by
  the repository's rust-toolchain.toml), pnpm via corepack, and bun.

# Built FROM the omni-agent image, never from source. The whole capability
# runtime, harness set and plugin set are inherited unchanged. The build
# script still stages its usual context, but the Dockerfile uses only scripts/.
# The only runtime difference is scripts/toolchain-entrypoint.sh, which runs
# before the shared /opt/agentic/entrypoint.sh and then execs it.
base:
  image: omni-agent

image:
  dockerfile: ./Dockerfile
  tag: agentic-workspace-toolchain
  context: ../../..
  args:
    # Local developer default: the tag scripts/build-provider.py gives an
    # omni-agent build. The release workflow overrides this with the exact
    # ghcr.io/agentparadise/agentic-workspace-omni-agent@sha256:... digest it
    # pushed earlier in the same run, so a published toolchain always sits on
    # a signed, same-commit omni.
    OMNI_IMAGE: omni-agent-workspace:latest

runtime:
  agent: claude
  agents:
    - claude
    - codex
  modes:
    - headless
  otel_native: true

# Inherited from omni-agent; listed so a reader of this manifest sees them.
plugins:
  include: []
  inherited_from: omni-agent

security:
  non_root: true
  user: agent
  uid: 1000
  gid: 1000
  no_setuid: true
  read_only_paths:
    - /opt/agentic
  network:
    enabled: true
    allowed_hosts: []

capabilities:
  runtimes:
    - name: node
      version: "22"
    - name: python
      version: "3.12"
    - name: bun
      version: "1.3.14"
  tools:
    - name: rustup
      version: "1.29.1"
      # Binary and proxies only. The toolchain is installed on first use from
      # the repository's rust-toolchain.toml into /workspace/.tools/rustup.
      toolchain: none
    - name: pnpm
      source: corepack
    - name: build-essential
      source: debian-bookworm

health:
  interval: 30s
  timeout: 3s
  start_period: 5s
  retries: 2

labels:
  org.opencontainers.image.title: "Agentic Workspace - Toolchain"
  org.opencontainers.image.description: "omni-agent plus a native toolchain (C toolchain, rustup, pnpm, bun)"
  org.opencontainers.image.vendor: "Agentic Workspace"
  org.opencontainers.image.source: "https://github.com/AgentParadise/agentic-workspace"
