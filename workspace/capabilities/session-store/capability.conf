# Session-store capability manifest. Read by workspace/entrypoint.sh 5.7 as
# DATA (never sourced). See docs/workspace-capabilities.md, "Capability
# manifest".
#
# degrade: the session store is a BACKUP of transcripts the orchestrator also
# keeps, so a failed doctor (store down, exporter missing, spool unwritable)
# starts the workspace with capture DISABLED instead of stopping it (#27).
# Set AGENTIC_SESSION_STORE_REQUIRED=1 to make it fatal again.
failure_policy=degrade
